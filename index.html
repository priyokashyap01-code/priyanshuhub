<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Priyanshu JEE Hub</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
}

header{
background:#1e293b;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:bold;
color:#38bdf8;
}

nav a{
color:white;
text-decoration:none;
margin-left:20px;
font-weight:bold;
}

.hero{
text-align:center;
padding:80px 20px;
}

.hero h1{
font-size:50px;
color:#38bdf8;
}

.hero p{
margin-top:20px;
font-size:20px;
}

.btn{
display:inline-block;
margin-top:30px;
padding:15px 30px;
background:#38bdf8;
color:white;
text-decoration:none;
border-radius:8px;
font-weight:bold;
}

.subjects{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:40px;
}

.card{
background:#1e293b;
padding:30px;
border-radius:10px;
text-align:center;
}

.card h2{
margin-bottom:15px;
color:#38bdf8;
}
</style>

</head>

<body>

<header>
<div class="logo">📚 Priyanshu JEE Hub</div>

<nav>
<a href="#">Home</a>
<a href="#">Notes</a>
<a href="#">PYQs</a>
<a href="#">Contact</a>
</nav>
</header>

<section class="hero">

<h1>Welcome to Priyanshu JEE Hub</h1>

<p>Hindi + English JEE Notes | PYQs | Study Material</p>

<a href="#" class="btn">Start Learning</a>

</section>

<section class="subjects">

<div class="card">
<h2>⚡ Physics</h2>
<p>Notes & Questions</p>
</div>

<div class="card">
<h2>🧪 Chemistry</h2>
<p>Physical, Organic & Inorganic</p>
</div>

<div class="card">
<h2>📐 Maths</h2>
<p>Algebra, Calculus & More</p>
</div>

</section>

</body>
</html>
