<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Priyanshu | Portfolio</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e3a8a,#312e81);
color:white;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 10%;
background:rgba(0,0,0,.25);
backdrop-filter:blur(10px);
}

.logo{
font-size:28px;
font-weight:bold;
color:#38bdf8;
}

nav ul{
display:flex;
list-style:none;
gap:25px;
}

nav a{
color:white;
text-decoration:none;
transition:.3s;
}

nav a:hover{
color:#38bdf8;
}

.hero{
height:90vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.hero h1{
font-size:60px;
margin-bottom:15px;
}

.hero span{
color:#38bdf8;
}

.hero p{
font-size:20px;
margin-bottom:30px;
}

.btn{
display:inline-block;
padding:14px 35px;
background:#38bdf8;
color:white;
text-decoration:none;
border-radius:50px;
transition:.3s;
}

.btn:hover{
background:#0ea5e9;
transform:scale(1.05);
}
</style>
</head>

<body>

<nav>
<div class="logo">Priyanshu</div>

<ul>
<li><a href="#">Home</a></li>
<li><a href="#">About</a></li>

</section>

</html>
